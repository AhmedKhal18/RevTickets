name: Code Quality Checks

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-type-check:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Install Node.js dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Backend - Run Black (format check)
        working-directory: ./backend
        run: black --check .
      
      - name: Backend - Run Flake8 (linting)
        working-directory: ./backend
        run: flake8 .
      
      - name: Backend - Run MyPy (type checking)
        working-directory: ./backend
        run: mypy .
      
      - name: Frontend - Run Prettier (format check)
        working-directory: ./frontend
        run: npm run format:check
      
      - name: Frontend - Run ESLint (linting)
        working-directory: ./frontend
        run: npm run lint
      
      - name: Frontend - Run TypeScript (type check)
        working-directory: ./frontend
        run: npm run type-check

