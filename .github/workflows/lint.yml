name: Code Quality Checks

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-type-check:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Install Node.js dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Backend - Run Black (format check)
        id: black-check
        working-directory: ./backend
        continue-on-error: true
        run: black --check .
      
      - name: Backend - Run Flake8 (linting)
        id: flake8-check
        working-directory: ./backend
        continue-on-error: true
        run: flake8 .
      
      - name: Backend - Run MyPy (type checking)
        id: mypy-check
        working-directory: ./backend
        continue-on-error: true
        run: mypy .
      
      - name: Frontend - Run Prettier (format check)
        id: prettier-check
        working-directory: ./frontend
        continue-on-error: true
        run: npm run format:check
      
      - name: Frontend - Run ESLint (linting)
        id: eslint-check
        working-directory: ./frontend
        continue-on-error: true
        run: npm run lint
      
      - name: Frontend - Run TypeScript (type check)
        id: typescript-check
        working-directory: ./frontend
        continue-on-error: true
        run: npm run type-check
      
      - name: Check for failed quality checks
        id: check-summary
        if: always()
        continue-on-error: true
        run: |
          failed_checks=()
          if [ "${{ steps.black-check.outcome }}" == "failure" ]; then failed_checks+=("Black"); fi
          if [ "${{ steps.flake8-check.outcome }}" == "failure" ]; then failed_checks+=("Flake8"); fi
          if [ "${{ steps.mypy-check.outcome }}" == "failure" ]; then failed_checks+=("MyPy"); fi
          if [ "${{ steps.prettier-check.outcome }}" == "failure" ]; then failed_checks+=("Prettier"); fi
          if [ "${{ steps.eslint-check.outcome }}" == "failure" ]; then failed_checks+=("ESLint"); fi
          if [ "${{ steps.typescript-check.outcome }}" == "failure" ]; then failed_checks+=("TypeScript"); fi
          
          if [ ${#failed_checks[@]} -gt 0 ]; then
            echo "::warning::The following quality checks failed: ${failed_checks[*]}"
            echo "These are non-blocking warnings. Please review the output above."
            exit 1
          else
            echo "✅ All quality checks passed!"
          fi

